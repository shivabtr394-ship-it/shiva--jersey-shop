<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIVA BKK JERSEY WORLD</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(black, #111);
  color: white;
}

/* Header */
.header {
  text-align:center;
  padding:20px;
  font-size:26px;
  font-weight:bold;
  color: gold;
}

/* Banner */
.banner {
  text-align:center;
  padding:10px;
  font-size:14px;
  color:#ccc;
}

/* Grid */
.container {
  display:grid;
  grid-template-columns: repeat(2,1fr);
  gap:12px;
  padding:12px;
}

/* Card */
.card {
  background:#1a1a1a;
  padding:10px;
  border-radius:12px;
  text-align:center;
  transition:0.3s;
}

.card:hover {
  transform: scale(1.05);
}

/* Image */
.card img {
  width:100%;
  border-radius:10px;
}

/* Text */
.card h3 {
  margin:8px 0 5px;
}

.price {
  color:lime;
  font-size:18px;
  font-weight:bold;
}

/* Badge */
.badge {
  background:red;
  color:white;
  padding:3px 8px;
  font-size:12px;
  border-radius:5px;
  display:inline-block;
  margin-bottom:5px;
}

/* Button */
.button {
  display:block;
  margin-top:8px;
  padding:10px;
  background:linear-gradient(green, limegreen);
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

.button:hover {
  background:limegreen;
}
</style>
</head>

<body>

<div class="header">⚽ SHIVA BKK JERSEY WORLD</div>
<div class="banner">🔥 Best Jerseys in Bangkok | Player & AAA Sets 🔥</div>

<div class="container">

<div class="card">
<span class="badge">HOT</span>
<img src="https://via.placeholder.com/200">
<h3>Manchester United</h3>
<p>Player Version</p>
<p class="price">360 THB</p>
<a class="button" href="https://wa.me/66617756506">Order Now</a>
</div>

<div class="card">
<span class="badge">NEW</span>
<img src="https://via.placeholder.com/200">
